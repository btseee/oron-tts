[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oron-tts"
version = "0.2.0"
description = "Mongolian (Khalkha Cyrillic) text-to-speech: an F5TTS_v1_Base finetune"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Battseren Badral"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Intentionally empty. `oron_tts.text` -- the normalizer, the number expander and
# the vocabulary contract -- is pure stdlib, so oron-cleaner can depend on this
# package for text handling without pulling torch into a data pipeline. Anything
# needing tensors lives behind an extra.
dependencies = [
  # configs set `logger: tensorboard`, and F5-TTS's Trainer imports
  # SummaryWriter in __init__ -- without this a run dies before its first
  # update, which is an expensive way to find a missing package on a rented GPU.
  "tensorboard>=2.16",
]

[project.optional-dependencies]
audio = [
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
]
# Training runs in upstream F5-TTS; this repo only supplies the vocabulary, the
# prepared dataset and the config.
train = [
    "f5-tts>=1.1.0",
    "safetensors>=0.4.0",
    "datasets>=3.0.0",
    "huggingface-hub>=0.19.0",
]
# Upstream's eval supports only zh/en, so the Mongolian harness is ours.
# bayartsogt/wav2vec2-large-xlsr-mongolian scores CER 0.123 median against
# whisper-large-v3's 0.311 on the same clips -- see docs/phase0-findings.md.
# Includes the audio extra: bandwidth measurement needs librosa.
eval = [
    "transformers>=4.40.0",
    "torch>=2.1.0",
    "torchaudio>=2.1.0",
    "numpy>=1.24.0",
    "soundfile>=0.12.0",
    "librosa>=0.10.0",
]
dev = [
    "ruff>=0.1.0",
    "isort>=5.12.0",
    "pytest>=7.4.0",
]

[project.scripts]
# The one user-facing command. Everything else under scripts/ is operator
# tooling run from a checkout, not something to install onto a PATH.
oron-tts-infer = "oron_tts.infer:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["oron_tts"]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["oron_tts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["oron_tts*"]

[tool.setuptools.package-data]
oron_tts = ["../data/oron_mn_pinyin/vocab.txt"]
