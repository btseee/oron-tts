# Finetune F5TTS_v1_Base on Mongolian (Khalkha Cyrillic).
#
# Copy to F5-TTS/src/f5_tts/configs/ and launch from the F5-TTS repo:
#
#   accelerate launch src/f5_tts/train/train.py --config-name f5tts_mn.yaml
#
# Or use finetune_cli.py, which sets the same values from flags.
#
# Prerequisites, in order:
#   1. oron-cleaner produces the strict corpus
#   2. scripts/build_f5_dataset.py writes data/oron_mn_pinyin/
#   3. scripts/extend_vocab.py --checkpoint ... writes
#      ckpts/oron_mn/pretrained_model_1250000.safetensors
#
# The `pretrained_` prefix is load-bearing: Trainer.load_checkpoint uses it to
# cold-start at update 0, and excludes the file from checkpoint rotation.

hydra:
  run:
    dir: ckpts/${model.name}_${model.mel_spec.mel_spec_type}_${model.tokenizer}_${datasets.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}

datasets:
  name: oron_mn
  # Upstream's own heuristic is 38400 * (GPU_GB - 5) / 75, i.e. ~13,800 on a
  # 32 GB card. 13000 frames is ~139 s of audio per step at hop 256 / 24 kHz.
  # DynamicBatchSampler silently DROPS any clip longer than this many frames --
  # 13000 frames is 138 s, far above the 20 s corpus cap, so nothing is lost.
  batch_size_per_gpu: 13000
  batch_size_type: frame
  max_samples: 32
  num_workers: 8

optim:
  # epochs sets the LR decay length: total_updates = updates_per_epoch * epochs,
  # and the scheduler decays linearly to ~0 across it. Set it to what you will
  # actually run, or the schedule is wrong in whichever direction you guessed.
  # PLACEHOLDER -- recompute once the corpus exists:
  #     python scripts/compute_epochs.py --data ../F5-TTS/data/oron_mn_pinyin
  # It depends on how clips pack, not on clip count. For scale: ~38.6 h packs
  # into ~1,132 updates/epoch at these settings, giving epochs: 36 for 40k
  # updates. The value below assumes ~30 h and will be wrong for the real corpus.
  epochs: 51
  # Upstream's finetune default. Pretraining uses 7.5e-5; that is far too hot
  # for adapting a 95k-hour model on tens of hours.
  learning_rate: 1.0e-5
  # 20000 is a pretraining default and absurd here. Note the trainer multiplies
  # this by num_processes, so divide by the GPU count on multi-GPU.
  num_warmup_updates: 2000
  # Keep at 1: scheduler.step() fires per batch rather than per optimizer
  # update, so accumulation compresses the LR schedule by that factor.
  grad_accumulation_steps: 1
  max_grad_norm: 1.0
  bnb_optimizer: False

model:
  name: F5TTS_v1_Base
  # Keep `pinyin`, not `custom`. load_dataset() and get_tokenizer() both
  # interpolate {name}_{tokenizer}; `custom` makes them read different paths.
  # Mongolian Cyrillic passes through convert_char_to_pinyin unchanged --
  # verified on 300 corpus sentences, every character and space preserved.
  tokenizer: pinyin
  tokenizer_path: null
  backbone: DiT
  arch:
    # v1 geometry. The community finetunes in SHARED.md all predate v1 and use
    # text_mask_padding: False with pe_attn_head: 1 -- do not copy those.
    dim: 1024
    depth: 22
    heads: 16
    ff_mult: 2
    text_dim: 512
    text_mask_padding: True
    qk_norm: null
    conv_layers: 4
    pe_attn_head: null
    attn_backend: torch
    attn_mask_enabled: False
    # Trades compute for memory. Leave True on 32 GB; turn off on 80 GB and
    # raise batch_size_per_gpu instead.
    checkpoint_activations: True
  mel_spec:
    target_sample_rate: 24000
    n_mel_channels: 100
    hop_length: 256
    win_length: 1024
    n_fft: 1024
    mel_spec_type: vocos
  vocoder:
    is_local: False
    local_path: null

ckpts:
  logger: tensorboard
  wandb_project: oron-tts
  wandb_run_name: ${model.name}_${model.tokenizer}_${datasets.name}
  wandb_resume_id: null
  # Synthesises a sample at every save. Worth the cost: the previous project's
  # 500-epoch run logged no audio at all, so it had no perceptual record.
  log_samples: True
  # Far more often than upstream's 50000. The paper's own small-data evidence
  # (Tab. 9: LJSpeech 24 h peaks at 200k updates then degrades to 2x the WER by
  # 600k) means the best checkpoint must be found by sweeping, not by training
  # to a fixed step. 2000 gives ~20 candidates across the run.
  save_per_updates: 2000
  # Each .pt is ~5.4 GB (weights + grads + AdamW + EMA). Prune each save to an
  # EMA-only safetensors for evaluation and keep only 3 full checkpoints.
  keep_last_n_checkpoints: 3
  last_per_updates: 1000
  save_dir: ckpts/${model.name}_${model.mel_spec.mel_spec_type}_${model.tokenizer}_${datasets.name}
